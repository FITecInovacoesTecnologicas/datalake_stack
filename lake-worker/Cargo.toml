[package]
name = "lake-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Rust worker for the lake: claims jobs from Postgres and runs DataFusion transformations over Iceberg tables"
publish = false

[[bin]]
name = "lake-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# Versions aligned with iceberg-rust 0.10.x (arrow/parquet 58, datafusion 53).
datafusion = { version = "53.1", default-features = false, features = ["parquet", "sql"] }
iceberg = "0.10"
iceberg-catalog-rest = "0.10"
serde_json = "1"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
codegen-units = 16
lto = "thin"

# Minimal Rust-first data lake (dev / PoC) -- revised
#   rustfs          -> S3-compatible object storage (Rust)
#   storage-init    -> one-shot: bucket + bucket-scoped access key (root key stays out of the lake)
#   postgres        -> ONE instance, two databases: "catalog" (Lakekeeper) and "jobs" (pg_cron + queue)
#   lakekeeper      -> Iceberg REST catalog (Rust)
#   lakekeeper-init -> one-shot: bootstrap + warehouse pointing at the bucket
#   lake-worker     -> Rust worker: job kinds (sql, ingest_http, ...) for raw -> clean -> curated
#   lake-query      -> (profile "query") SQL endpoint: DataFusion is a library, it needs a server
#   pg-backup       -> (profile "ops") on-demand pg_dump of both databases
#   lake-backup     -> (profile "ops") on-demand copy of the lake bucket
#
# Storage access model: STS is off. Lakekeeper and the Rust services use the same
# bucket-scoped key; other Iceberg clients can use Lakekeeper remote signing.
#
# Not covered here (worker jobs): snapshot expiration, orphan-file cleanup and
# compaction. Open-source Lakekeeper only runs the tabular_expiration,
# tabular_purge and task_log_cleanup queues.
#
#   docker compose up -d                          # core stack
#   docker compose --profile query up -d          # + SQL endpoint
#   docker compose up -d --scale lake-worker=3    # more workers
#   docker compose run --rm pg-backup             # dump catalog + jobs to ./backups
#   docker compose run --rm lake-backup           # copy the lake bucket to ./backups

name: rust-datalake

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Connection settings shared by every Iceberg client in the stack.
x-lake-client-env: &lake-client-env
  LAKE_CATALOG_URI: http://lakekeeper:8181/catalog
  LAKE_WAREHOUSE: ${LAKE_WAREHOUSE:?set LAKE_WAREHOUSE in .env}
  LAKE_S3_ENDPOINT: http://rustfs:9000
  LAKE_S3_REGION: ${LAKE_S3_REGION:?set LAKE_S3_REGION in .env}
  LAKE_S3_PATH_STYLE: "true"
  LAKE_S3_ACCESS_KEY_ID: ${LAKE_S3_ACCESS_KEY:?set LAKE_S3_ACCESS_KEY in .env}
  LAKE_S3_SECRET_ACCESS_KEY: ${LAKE_S3_SECRET_KEY:?set LAKE_S3_SECRET_KEY in .env}
  # Send as the X-Iceberg-Access-Delegation header: Lakekeeper then returns only
  # endpoint/region and the client signs with the key above.
  LAKE_ACCESS_DELEGATION: client-managed
  RUST_LOG: info

# Build of the Rust services: one Dockerfile at the repo root (Cargo workspace), one
# target per service. Both targets share the builder stage, so the dependencies are
# compiled once. RUST_RELEASE_LTO=thin turns link-time optimization back on.
x-rust-build: &rust-build
  context: .
  dockerfile: Dockerfile
  args:
    CARGO_PROFILE_RELEASE_LTO: ${RUST_RELEASE_LTO:-false}

services:
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:?pin RUSTFS_VERSION in .env (>= 1.0.0, never latest)}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:?set RUSTFS_ROOT_USER in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?set RUSTFS_ROOT_PASSWORD in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (localhost only)
      - "127.0.0.1:9001:9001"   # Web console (localhost only)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  # One-shot, idempotent: creates the lake bucket and a service account whose
  # policy is limited to that bucket. Only this job ever uses the root key.
  storage-init:
    image: rustfs/rc:${RC_VERSION:?pin RC_VERSION in .env}
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD}
      LAKE_BUCKET: ${LAKE_BUCKET:?set LAKE_BUCKET in .env}
      LAKE_S3_REGION: ${LAKE_S3_REGION}
      LAKE_S3_ACCESS_KEY: ${LAKE_S3_ACCESS_KEY}
      LAKE_S3_SECRET_KEY: ${LAKE_S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        rc alias set lake http://rustfs:9000 "$$RUSTFS_ROOT_USER" "$$RUSTFS_ROOT_PASSWORD" --region "$$LAKE_S3_REGION" >/dev/null
        rc bucket create "lake/$$LAKE_BUCKET" --ignore-existing

        cat > /tmp/lake-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:ListBucketMultipartUploads"],
              "Resource": ["arn:aws:s3:::$$LAKE_BUCKET"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
              "Resource": ["arn:aws:s3:::$$LAKE_BUCKET/*"]
            }
          ]
        }
        EOF

        if rc admin service-account info lake "$$LAKE_S3_ACCESS_KEY" >/dev/null 2>&1; then
          rc admin service-account update lake "$$LAKE_S3_ACCESS_KEY" --secret-key "$$LAKE_S3_SECRET_KEY" --policy /tmp/lake-policy.json >/dev/null
          echo "lake access key updated"
        else
          rc admin service-account create lake "$$LAKE_S3_ACCESS_KEY" "$$LAKE_S3_SECRET_KEY" --name lake --policy /tmp/lake-policy.json >/dev/null
          echo "lake access key created"
        fi
        echo "bucket $$LAKE_BUCKET ready"
    restart: "no"
    logging: *default-logging

  # Single Postgres for catalog metadata AND scheduler/job queue.
  # Isolation is logical: separate databases and roles. Split into two instances
  # only when the catalog needs its own SLA, backup window or upgrade cadence.
  # Image is the existing ./jobs-db build (Postgres >= 15 with pg_cron).
  postgres:
    build: ./jobs-db
    image: rust-datalake/postgres:local
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=jobs
      - -c
      - cron.use_background_workers=on
      - -c
      - cron.timezone=UTC
      - -c
      - max_worker_processes=20
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER:?set PG_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?set PG_ADMIN_PASSWORD in .env}
      POSTGRES_DB: jobs
      # Used by the init scripts only (first start on an empty volume).
      JOBS_WORKER_PASSWORD: ${JOBS_WORKER_PASSWORD:?set JOBS_WORKER_PASSWORD in .env}
      CATALOG_DB_NAME: catalog
      CATALOG_DB_USER: lakekeeper
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./jobs-db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"   # inspect locally (localhost only)
    healthcheck:
      # -h 127.0.0.1 forces TCP: the temporary server that runs the init
      # scripts listens on the unix socket only, so this cannot pass early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${PG_ADMIN_USER} -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION:?pin LAKEKEEPER_VERSION in .env}
    command: ["migrate"]
    environment: &lakekeeper-env
      # Discrete fields instead of a URL: the password needs no URL-encoding.
      LAKEKEEPER__PG_HOST_W: postgres
      LAKEKEEPER__PG_PORT: "5432"
      LAKEKEEPER__PG_USER: lakekeeper
      LAKEKEEPER__PG_PASSWORD: ${CATALOG_DB_PASSWORD}
      LAKEKEEPER__PG_DATABASE: catalog
      # Encrypts the storage credentials kept in the catalog. Back it up:
      # without it the stored warehouse credential cannot be decrypted.
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?set LAKEKEEPER_ENCRYPTION_KEY in .env}
      # No authentication: acceptable only while 8181 is bound to localhost.
      # Before exposing it, set LAKEKEEPER__OPENID_PROVIDER_URI and
      # LAKEKEEPER__OPENID_AUDIENCE, then bootstrap again on a fresh catalog.
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  lakekeeper:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION}
    command: ["serve"]
    restart: unless-stopped
    environment: *lakekeeper-env
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8181:8181"   # Iceberg REST catalog + UI (localhost only)
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # One-shot, idempotent: bootstraps Lakekeeper and creates the warehouse.
  lakekeeper-init:
    image: curlimages/curl:${CURL_VERSION:?pin CURL_VERSION in .env}
    depends_on:
      lakekeeper:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      LAKE_WAREHOUSE: ${LAKE_WAREHOUSE}
      LAKE_BUCKET: ${LAKE_BUCKET}
      LAKE_S3_REGION: ${LAKE_S3_REGION}
      LAKE_S3_ACCESS_KEY: ${LAKE_S3_ACCESS_KEY}
      LAKE_S3_SECRET_KEY: ${LAKE_S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        LK=http://lakekeeper:8181/management/v1
        JSON='Content-Type: application/json'

        if curl -fsS "$$LK/info" | grep -Eq '"bootstrapped" *: *true'; then
          echo "lakekeeper already bootstrapped"
        else
          curl -sS --fail-with-body -X POST "$$LK/bootstrap" -H "$$JSON" -d '{"accept-terms-of-use": true}'
          echo "lakekeeper bootstrapped"
        fi

        if curl -fsS "$$LK/warehouse" | grep -Eq "\"name\" *: *\"$$LAKE_WAREHOUSE\""; then
          echo "warehouse $$LAKE_WAREHOUSE already exists"
        else
          curl -sS --fail-with-body -o /dev/null -X POST "$$LK/warehouse" -H "$$JSON" -d @- <<EOF
        {
          "warehouse-name": "$$LAKE_WAREHOUSE",
          "storage-profile": {
            "type": "s3",
            "bucket": "$$LAKE_BUCKET",
            "key-prefix": "$$LAKE_WAREHOUSE",
            "endpoint": "http://rustfs:9000",
            "region": "$$LAKE_S3_REGION",
            "path-style-access": true,
            "flavor": "s3-compat",
            "sts-enabled": false,
            "remote-signing-enabled": true
          },
          "storage-credential": {
            "type": "s3",
            "credential-type": "access-key",
            "aws-access-key-id": "$$LAKE_S3_ACCESS_KEY",
            "aws-secret-access-key": "$$LAKE_S3_SECRET_KEY"
          },
          "delete-profile": { "type": "hard" }
        }
        EOF
          echo "warehouse $$LAKE_WAREHOUSE created"
        fi
    restart: "no"
    logging: *default-logging

  # Rust worker: claims queued jobs and runs transformations.
  lake-worker:
    build:
      <<: *rust-build
      target: lake-worker
    image: rust-datalake/lake-worker:local
    restart: unless-stopped
    init: true                # forwards SIGTERM to the worker so the grace period is real
    stop_grace_period: 2m     # let a running job finish on shutdown
    environment:
      <<: *lake-client-env
      # Keep JOBS_WORKER_PASSWORD URL-safe (hex), it is embedded in this URL.
      JOBS_DATABASE_URL: postgresql://lake_worker:${JOBS_WORKER_PASSWORD}@postgres:5432/jobs
      POLL_INTERVAL_SECS: "5"
      # A running job refreshes its heartbeat every lease/3 s; a job silent for a whole
      # lease is requeued by any replica. Failed jobs retry after backoff * 2^(attempt-1).
      JOB_LEASE_SECS: ${JOB_LEASE_SECS:-60}
      JOB_RETRY_BACKOFF_SECS: ${JOB_RETRY_BACKOFF_SECS:-30}
      # DataFusion memory pool must stay below the container limit; spill the rest.
      LAKE_MEMORY_LIMIT_MB: ${WORKER_POOL_MB:-1400}
      LAKE_SPILL_DIR: /spill
      # Job kind ingest_http: https only, and only to these hosts (comma-separated, exact
      # match). Empty = no external source allowed. Keeps payload URLs away from the
      # internal services (postgres, rustfs, lakekeeper).
      INGEST_HTTP_ALLOWED_HOSTS: ${INGEST_HTTP_ALLOWED_HOSTS:-}
      INGEST_HTTP_MAX_BYTES: ${INGEST_HTTP_MAX_BYTES:-33554432}
      INGEST_HTTP_TIMEOUT_SECS: ${INGEST_HTTP_TIMEOUT_SECS:-60}
    volumes:
      - /spill                # anonymous: one spill dir per replica
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      lakekeeper-init:
        condition: service_completed_successfully
    logging: *default-logging

  # Read-only SQL endpoint over the lake: Arrow Flight SQL on DataFusion + iceberg-rust.
  # Not started by default. Every call needs LAKE_QUERY_TOKEN (Bearer, or Basic password).
  lake-query:
    profiles: ["query"]
    build:
      <<: *rust-build
      target: lake-query
    image: rust-datalake/lake-query:local
    restart: unless-stopped
    init: true
    environment:
      <<: *lake-client-env
      LAKE_QUERY_LISTEN: "0.0.0.0:50051"
      LAKE_QUERY_TOKEN: ${LAKE_QUERY_TOKEN:?set LAKE_QUERY_TOKEN in .env}
      LAKE_MEMORY_LIMIT_MB: ${QUERY_POOL_MB:-2800}
      LAKE_SPILL_DIR: /spill
      # How old the namespace/table listing may get before a request refreshes it.
      LAKE_METADATA_CACHE_TTL_SECS: "30"
    volumes:
      - /spill
    mem_limit: ${QUERY_MEM_LIMIT:-4g}
    cpus: ${QUERY_CPUS:-4}
    ports:
      - "127.0.0.1:50051:50051"   # Flight SQL (localhost only)
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    logging: *default-logging

  # On-demand logical backup of both databases:  docker compose run --rm pg-backup
  pg-backup:
    profiles: ["ops"]
    image: rust-datalake/postgres:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${PG_ADMIN_USER}
      PGPASSWORD: ${PG_ADMIN_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ts=$$(date -u +%Y%m%dT%H%M%SZ)
        for db in catalog jobs; do
          pg_dump -Fc -d "$$db" -f "/backups/$$db-$$ts.dump"
          echo "wrote /backups/$$db-$$ts.dump"
        done
    restart: "no"

  # On-demand copy of the lake bucket (table data + Iceberg metadata):
  #   docker compose run --rm lake-backup
  # Uses the bucket-scoped key, never the root key. Run it right after pg-backup so the
  # catalog dump and the data copy describe the same state.
  lake-backup:
    profiles: ["ops"]
    image: rustfs/rc:${RC_VERSION}
    user: "0:0"               # writes into the host bind mount, like pg-backup
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      LAKE_BUCKET: ${LAKE_BUCKET}
      LAKE_S3_REGION: ${LAKE_S3_REGION}
      LAKE_S3_ACCESS_KEY: ${LAKE_S3_ACCESS_KEY}
      LAKE_S3_SECRET_KEY: ${LAKE_S3_SECRET_KEY}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ts=$$(date -u +%Y%m%dT%H%M%SZ)
        rc alias set lake http://rustfs:9000 "$$LAKE_S3_ACCESS_KEY" "$$LAKE_S3_SECRET_KEY" --region "$$LAKE_S3_REGION" >/dev/null
        mkdir -p "/backups/$$LAKE_BUCKET-$$ts"
        rc mirror "lake/$$LAKE_BUCKET" "/backups/$$LAKE_BUCKET-$$ts"
        echo "wrote /backups/$$LAKE_BUCKET-$$ts"
    restart: "no"

volumes:
  rustfs-data:
  pg-data:
